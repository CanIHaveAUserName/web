<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Malachitee</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    background:#050806;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Animated malachite background */

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%, rgba(0,255,140,.12), transparent 30%),
    radial-gradient(circle at 80% 40%, rgba(0,120,70,.15), transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(0,255,170,.10), transparent 30%),
    linear-gradient(135deg,#03110b,#071b14,#020504);
    animation:bgMove 18s infinite alternate ease-in-out;
    transform:scale(1.2);
}

@keyframes bgMove{
    0%{
        filter:hue-rotate(0deg);
        transform:scale(1.15) translateY(0px);
    }
    100%{
        filter:hue-rotate(20deg);
        transform:scale(1.25) translateY(-15px);
    }
}

/* Scanlines */

.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.06;
    background:
    repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(255,255,255,.12) 3px
    );
}

/* Main Card */

.card{
    width:420px;
    backdrop-filter:blur(16px);
    background:rgba(8,15,11,.62);
    border:1px solid rgba(0,255,150,.18);
    border-radius:28px;
    padding:32px;
    position:relative;
    z-index:2;
    box-shadow:
    0 0 40px rgba(0,255,140,.08),
    inset 0 0 20px rgba(0,255,120,.04);
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Avatar */

.avatar{
    width:130px;
    height:130px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    border:3px solid rgba(0,255,150,.45);
    box-shadow:0 0 25px rgba(0,255,150,.25);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Username */

h1{
    font-family:'Cinzel',serif;
    text-align:center;
    margin-top:18px;
    font-size:2.2rem;
    color:#9dffcb;
    text-shadow:
    0 0 10px rgba(0,255,140,.35),
    0 0 20px rgba(0,255,140,.15);
}

.glow-line{
    width:120px;
    height:3px;
    margin:14px auto 22px;
    border-radius:999px;
    background:linear-gradient(to right,#00ff88,#00b36b,#00ffcc);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:.5;
        transform:scaleX(.9);
    }
    50%{
        opacity:1;
        transform:scaleX(1.05);
    }
}

/* Bio */

.bio{
    text-align:center;
    line-height:1.7;
    color:#d4e8dc;
    font-size:.96rem;
    margin-bottom:24px;
}

/* Socials */

.socials{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

.socials a{
    text-decoration:none;
    color:white;
    background:rgba(0,255,140,.08);
    border:1px solid rgba(0,255,140,.16);
    padding:10px 18px;
    border-radius:14px;
    transition:.25s;
    font-size:.92rem;
}

.socials a:hover{
    transform:translateY(-3px);
    background:rgba(0,255,140,.18);
    box-shadow:0 0 15px rgba(0,255,140,.15);
}

/* Music Player */

.player{
    margin-top:28px;
    padding:18px;
    border-radius:18px;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(0,255,140,.12);
}

.song{
    margin-bottom:12px;
    color:#9dffcb;
    font-weight:600;
    text-align:center;
}

audio{
    width:100%;
    filter:hue-rotate(85deg) saturate(1.2);
}

/* floating particles */

.particle{
    position:absolute;
    border-radius:50%;
    background:rgba(0,255,140,.18);
    animation:float linear infinite;
}

.particle:nth-child(1){
    width:8px;
    height:8px;
    left:15%;
    animation-duration:14s;
}

.particle:nth-child(2){
    width:5px;
    height:5px;
    left:72%;
    animation-duration:18s;
}

.particle:nth-child(3){
    width:12px;
    height:12px;
    left:45%;
    animation-duration:22s;
}

@keyframes float{
    from{
        transform:translateY(120vh);
    }
    to{
        transform:translateY(-20vh);
    }
}

.footer{
    text-align:center;
    margin-top:20px;
    opacity:.45;
    font-size:.8rem;
}
</style>
</head>

<body>

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<div class="scanlines"></div>

<div class="card">

<div class="avatar">
<img src="MOSHED-2025-11-30-0-14-15.gif" alt="Avatar">
</div>

<h1>Malachitee</h1>

<div class="glow-line"></div>

<div class="bio">
Digital rot. Balls of Steel.  
Static-filled nights and green neon dreams.
</div>

<div class="socials">
<a href="https://x.com/CyroTheProtogen" target="_blank">Twitter</a>
<a href="https://discord.gg/fGaBajtQPF" target="_blank">Discord</a>
<a href="https://malachitevr.win" target="_blank">Website</a>
</div>

<div class="player">
<div class="song">GHOSTEMANE — Mercury</div>

<audio controls>
<source src="GHOSTEMANE - Mercury.mp3" type="audio/mpeg">
</audio>
</div>

<div class="footer">
yes I am a furry uwu
</div>

</div>

</body>
</html>
